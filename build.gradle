plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

// gradle.properties holds the base version; release builds can override it with -Prelease_version.
var releaseVersion = providers.gradleProperty('release_version').orElse(mod_version).get()
version = releaseVersion
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Inactive parts, switched in gradle.properties: their sources stay in the tree, outside the build.
var emiEnabled = providers.gradleProperty('emi_enabled').orElse('false').get().toBoolean()
var reiEnabled = providers.gradleProperty('rei_enabled').orElse('false').get().toBoolean()
var ocEnabled = providers.gradleProperty('oc_enabled').orElse('false').get().toBoolean()
var datagenEnabled = providers.gradleProperty('datagen_enabled').orElse('false').get().toBoolean()

neoForge {
    version = project.neo_version


    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('run/mc-26.1.2/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // own folder: GameTests always run with only Minecraft, NeoForge and this mod
            gameDirectory = project.file('run/mc-26.1.2/gametest')
            systemProperty 'biggerreactorsrework.testEnergyItems', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Same GameTests with optional mods placed by hand in run/mc-26.1.2/gametest-compat/mods (never bundled).
        gameTestCompat {
            type = 'gameTestServer'
            gameDirectory = project.file('run/mc-26.1.2/gametest-compat')
            systemProperty 'biggerreactorsrework.testEnergyItems', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Optional 26.1.2 scripting runtimes are supplied separately; never add them to the base runtime classpath.
        gameTestScripting {
            type = 'gameTestServer'
            gameDirectory = project.file('run/mc-26.1.2/gametest-scripting')
            systemProperty 'biggerreactorsrework.testEnergyItems', 'true'
            systemProperty 'biggerreactorsrework.testScripting', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        if (datagenEnabled) {
            data {
                data()
                gameDirectory = project.file('run/datagen')
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/main/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }
        }

        clientVerification {
            client()
            gameDirectory = project.file('run/mc-26.1.2/client-verification')
        }

        serverVerification {
            server()
            gameDirectory = project.file('run/mc-26.1.2/server-verification')
            programArgument '--nogui'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main {
    java {
        // Not part of the current port (kept unchanged in the tree): the unregistered reactor2 prototype.
        exclude 'biggerreactorsrework/multiblocks/reactor2/**'
        if (!emiEnabled) exclude 'biggerreactorsrework/client/deps/emi/**'
        if (!reiEnabled) exclude 'biggerreactorsrework/client/deps/rei/**'
        if (!ocEnabled) {
            exclude 'biggerreactorsrework/compat/opencomputers/**'
            exclude 'biggerreactorsrework/gametest/OpenComputersGameTests.java'
        }
        if (!datagenEnabled) exclude 'biggerreactorsrework/data/**'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // Modified 2026-11-01: official 26.1.2 scripting APIs, compile-only.
    exclusiveContent {
        forRepository {
            maven {
                name = 'LatvianMods'
                url = 'https://maven.latvian.dev/releases'
            }
        }
        filter { includeModule 'dev.latvian.mods', 'kubejs-neoforge'; includeModule 'dev.latvian.mods', 'rhino' }
    }
    maven {
        name = 'CCTweaked'
        url = 'https://maven.squiddev.cc'
        content { includeGroup 'cc.tweaked' }
    }
    // Optional integrations: compile-only APIs, nothing is bundled.
    if (reiEnabled) {
        maven {
            name = 'Shedaniel'
            url = 'https://maven.shedaniel.me/'
            content { includeGroup 'me.shedaniel'; includeGroup 'dev.architectury'; includeGroup 'me.shedaniel.cloth' }
        }
    }
    if (emiEnabled) {
        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/'
            content { includeGroup 'dev.emi' }
        }
    }
    if (ocEnabled) {
        maven {
            name = 'OpenComputers'
            url = 'https://maven.michiyo.me/releases/'
            content { includeGroup 'li.cil.oc' }
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
    // Modified 2026-10-31: optional native peripherals; the CC implementation is never bundled.
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cc_version}") { transitive = false }
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cc_version}") { transitive = false }
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_version}") { transitive = false }
    if (ocEnabled) compileOnly("li.cil.oc:opencomputers:${oc_version}:api") { transitive = false }
    if (reiEnabled) {
        compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
        compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    }
    if (emiEnabled) compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    // Exercise the real decoder/configuration using libraries already supplied by Minecraft.
    testImplementation files(provider { configurations.compileClasspath.files.findAll {
        it.name.startsWith('fastutil-') || it.name.startsWith('datafixerupper-')
    } })
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.matching { it.name == 'runGameTestScripting' }.configureEach {
    doFirst {
        copy { from 'src/test/resources/compat/kubejs'; into 'run/mc-26.1.2/gametest-scripting/kubejs' }
    }
}

tasks.named('jar', Jar).configure {
    // Modified 2026-10-26: test code remains available to development runs only.
    exclude 'biggerreactorsrework/gametest/**'
    exclude 'biggerreactorsrework/data/**'
    exclude 'data/biggerreactorsrework/structure/empty_*x*x*.nbt'
    exclude 'data/biggerreactorsrework/structure/saved_turbine_reload.nbt'
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
        ])
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            optional_dependencies  : """
[[dependencies.\${mod_id}]]
    modId="computercraft"
    type="optional"
    versionRange="[\${cc_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.\${mod_id}]]
    modId="kubejs"
    type="optional"
    versionRange="[${kubejs_version},)"
    ordering="AFTER"
    side="BOTH"
""".replace('\${mod_id}', mod_id).replace('\${cc_version}', cc_version) + (ocEnabled ? """
[[dependencies.\${mod_id}]]
    modId="opencomputers"
    type="optional"
    versionRange="[\${oc_version},)"
    ordering="AFTER"
    side="BOTH"
""".replace('\${mod_id}', mod_id).replace('\${oc_version}', project.findProperty('oc_version').toString()) : ''),
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
