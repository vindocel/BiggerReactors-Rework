modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/vindocel/BiggerReactors-Rework/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/vindocel/BiggerReactors-Rework"
bannerFile="logo.png"
credits="Fork of BiggerReactors by RogueLogix (https://github.com/BiggerSeries/BiggerReactors, https://www.curseforge.com/members/roguelogix), with contributions from gizmocodes and Ridanisaurus. Derived from the original Big Reactors by ErogenousBeef (https://github.com/erogenousbeef-zz/BigReactors)."
authors="RogueLogix, gizmocodes, Ridanisaurus; rework by vindocel"
description='''
Independent fork and rework of BiggerReactors for Minecraft ${minecraft_version} on NeoForge.

Original BiggerReactors by RogueLogix: https://github.com/BiggerSeries/BiggerReactors
Original Big Reactors by ErogenousBeef: https://github.com/erogenousbeef-zz/BigReactors

This rework is not affiliated with or endorsed by the original authors.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
${optional_dependencies}
